<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rescript-signals — reactive signals for ReScript</title>
  <meta name="description" content="Fine-grained reactive state for ReScript: signals, computed values and effects, with automatic dependency tracking and no runtime dependencies.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    // Resolve the theme before first paint, so the page never renders in one
    // theme and then switches. Theme.res adopts whatever is decided here.
    (function () {
      try {
        var stored = localStorage.getItem('rescript-signals-theme')
        var dark = stored ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    })()
  </script>
</head>
<body>
  <a href="#main-content" class="skip-to-content">Skip to content</a>
  <div id="app"><!--ssr-outlet--></div>
  <script type="module" src="/src/Main.res.mjs"></script>
</body>
</html>
